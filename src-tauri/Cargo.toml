[package]
name = "speechlab"
version = "0.1.0"
description = "Experimental offline STT/TTS evaluation lab"
edition = "2021"

[lib]
name = "speechlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
