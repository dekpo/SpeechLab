[package]
name = "speechlab"
version = "0.1.0"
description = "Experimental offline STT/TTS evaluation lab"
edition = "2021"

[lib]
name = "speechlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=1.13.8"
hound = "3"
ureq = { version = "2", features = ["native-certs"] }
bzip2 = "0.4"
tar = "0.4"
sha2 = "0.10"
